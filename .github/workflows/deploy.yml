name: CI/CD - Deploy Flask to AKS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./app
        file: ./app/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/flask-todo-app:latest

    - name: Set up kubectl
      uses: azure/setup-kubectl@v4

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Connect to AKS Cluster
      run: |
        az aks get-credentials --resource-group todo-rg --name todo-aks-cluster --overwrite-existing

    - name: Deploy to Kubernetes
      run: |
        # Apply in correct order
        kubectl apply -f k8s/namespace.yaml
        kubectl apply -f k8s/
        kubectl rollout restart deployment/flask-app -n todo-app --request-timeout=2m